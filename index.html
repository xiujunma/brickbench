<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrickBench: build models from virtual bricks in your browser and export them to LDraw, glTF and images." />
    <meta name="theme-color" content="#f1ede5" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 7 28 13 16 19 4 13Z' fill='%23d9480f' opacity='.45'/%3E%3Cpath d='M4 13 16 19v8.5L4 21.5Z' fill='%23d9480f' opacity='.8'/%3E%3Cpath d='M28 13 16 19v8.5l12-6Z' fill='%23d9480f'/%3E%3C/svg%3E"
    />
    <title>BrickBench</title>
    <style>
      /* shown only if startup waits, e.g. for the parts library a saved model uses */
      .boot-note {
        margin: 42vh 0 0;
        color: #8a8276;
        font: 14px/1.4 system-ui, sans-serif;
        text-align: center;
        opacity: 0;
        animation: boot-note-in 0.2s 0.6s forwards;
      }
      @keyframes boot-note-in {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><p class="boot-note">Loading BrickBench…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
