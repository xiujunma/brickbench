[test]
# e2e/ and e2e-desktop/ hold the Playwright tests: `bun run e2e`, `bun run e2e:desktop`
pathIgnorePatterns = ["e2e/**", "e2e-desktop/**", "node_modules/**", "dist/**", "public/**", ".desktop/**", "release/**"]
coverageSkipTestFiles = true
# the unit-tested core; React panels and WebGL views are covered by the browser tests
coveragePathIgnorePatterns = ["src/testing/**", "**/*.verify.ts", "src/ui/**", "src/app/**", "src/editor/**"]
coverageThreshold = { lines = 0.8, functions = 0.8 }
